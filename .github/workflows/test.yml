name: スクリプト動作テスト

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 構文チェック
        run: python3 -m py_compile download_81dojo_kifu.py

      - name: CSA→KIF変換テスト
        run: python3 test_kifu.py
